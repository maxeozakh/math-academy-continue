<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Continue placement · before / after film</title>
<style>
  :root { --bg: #10131a; --muted: #8a93a6; --good: #4cc38a; --bad: #e5826b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  body {
    width: 1920px; height: 1080px; position: relative;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #eef1f6;
  }
  .label { position: absolute; top: 44px; width: 900px; height: 64px; display: flex; align-items: center; gap: 14px; }
  .tag {
    font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 6px;
  }
  .tag.before { background: #2a2f3b; color: #c4cad6; }
  .tag.after { background: #1f3d6e; color: #a9c8ff; }
  .label h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }

  .window {
    position: absolute; top: 124px; width: 900px; height: 860px;
    border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
  }
  .bar {
    height: 34px; background: #eceef2; display: flex; align-items: center; padding: 0 14px; gap: 8px;
    border-bottom: 1px solid #dcdfe4;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .url {
    margin-left: 18px; flex: 1; height: 22px; border-radius: 6px; background: #fff;
    color: #5f6672; font-size: 12px; display: flex; align-items: center; padding: 0 10px;
  }
  .viewport { position: relative; width: 900px; height: 826px; overflow: hidden; }
  .viewport iframe {
    position: absolute; left: 0; top: 0; border: 0;
    width: 750px; height: 688.33px; transform: scale(1.2); transform-origin: 0 0;
  }

  .stats { position: absolute; top: 1004px; width: 900px; display: flex; gap: 36px; font-size: 20px; color: var(--muted); }
  .stats b { color: #eef1f6; font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 8px; }
  .stats .done b { color: var(--good); }
  .stats .slow b { color: var(--bad); }

  .cursor { position: absolute; left: 0; top: 0; z-index: 50; width: 26px; height: 26px; transform-origin: 3px 2px; pointer-events: none; }
  .ring { position: absolute; left: 0; top: 0; z-index: 49; border-radius: 50%; box-shadow: inset 0 0 0 2px #2e66b0; pointer-events: none; display: none; }

</style>
</head>
<body>
  <div class="label" style="left:48px"><span class="tag before">Today</span><h2>Submit and Continue sit under the content</h2></div>
  <div class="label" style="left:972px"><span class="tag after" id="rtag">Proposal A</span><h2 id="rtitle"></h2></div>

  <div class="window" style="left:48px">
    <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="url">mathacademy.com/tasks/14975943/topics/6341/lesson</span></div>
    <div class="viewport"><iframe id="left" src="../index.html?embed&variant=original"></iframe></div>
  </div>
  <div class="window" style="left:972px">
    <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="url">mathacademy.com/tasks/14975943/topics/6341/lesson</span></div>
    <div class="viewport"><iframe id="right" src="../index.html?embed&variant=top"></iframe></div>
  </div>

  <div class="stats" id="lstats" style="left:48px"><span class="steps">steps done<b>0</b></span><span class="px">scrolled<b>0 px</b></span></div>
  <div class="stats" id="rstats" style="left:972px"><span class="steps done">steps done<b>0</b></span><span class="px done">scrolled<b>0 px</b></span></div>

  <svg class="cursor" id="rcur" viewBox="0 0 22 22"><path d="M3 2 L3 18.2 L7.3 14.3 L10.1 20.6 L12.9 19.4 L10.1 13.2 L15.8 13.2 Z" fill="#0b0c0f" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>

  <script src="film.js"></script>

</html>
